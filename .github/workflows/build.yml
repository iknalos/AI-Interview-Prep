name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/news.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # A stable committed keystore means every build is signed identically, so
      # the app updates in place instead of needing an uninstall.
      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f app/aiprep.keystore ]; then
            keytool -genkeypair -v -keystore app/aiprep.keystore \
              -storepass aiprep -keypass aiprep -alias aiprep \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AIInterviewPrep"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/aiprep.keystore
            git commit -m "Add persistent signing keystore [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Validate bundled content
        run: python3 scripts/validate_content.py

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-Interview-Prep.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Interview-Prep-apk
          path: AI-Interview-Prep.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Interview Prep v1.0.${{ github.run_number }}
          files: AI-Interview-Prep.apk
          body: |
            200 interview questions across 8 topics, spaced repetition, scored quizzes,
            mock interview mode, topic lessons, and a daily AI news feed.

            Install the APK on Android 8.0 or newer. Updates install in place.
