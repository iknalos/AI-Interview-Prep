name: Daily AI news

on:
  schedule:
    # 06:20 UTC every day, a little off the hour so the feeds have settled.
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/daily-news.yml'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, so there is nothing to install and no dependency
      # that can break the daily run.
      - name: Fetch feeds
        run: python scripts/fetch_news.py --out docs/news.json --max 60 --min-items 8

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/news.json; then
            echo "No feed changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          git commit -m "News: update feed for $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
